ard:'Tendai Ncube',time:'Today, 09:10',status:'Demo record',detail:'All access points checked. East gate secured after inspection.'},{id:'OB-0183',title:'Visitor arrival recorded',site:'Borrowdale Offices',guard:'Rudo Maseko',time:'Today, 08:25',status:'Demo record',detail:'Scheduled delivery arrived and was directed to reception.'},{id:'OB-0182',title:'Shift started',site:'Granite Logistics',guard:'Farai Dube',time:'Today, 06:00',status:'Demo record',detail:'Day shift commenced. Equipment checked.'}],handovers:[{id:'HO-082',title:'East gate requires follow-up',site:'Avondale Business Park',guard:'Tendai Ncube',time:'Today, 06:10',status:'Needs review',detail:'Check the east gate latch and confirm maintenance request with the site contact.'},{id:'HO-081',title:'Loading bay lights reported',site:'Granite Logistics',guard:'Farai Dube',time:'Yesterday, 18:05',status:'Acknowledged',detail:'Two lights are out near the loading bay. Continue patrols until repaired.'}],guards:[{name:'Tendai Ncube',site:'Avondale Business Park',shift:'06:00 – 18:00',status:'On duty'},{name:'Rudo Maseko',site:'Borrowdale Offices',shift:'06:00 – 18:00',status:'On duty'},{name:'Farai Dube',site:'Granite Logistics',shift:'06:00 – 18:00',status:'On duty'},{name:'Nyasha Moyo',site:'Eastgate Warehouse',shift:'18:00 – 06:00',status:'Scheduled'},{name:'David Chari',site:'Avondale Business Park',shift:'18:00 – 06:00',status:'Scheduled'}],sites:[{name:'Avondale Business Park',area:'Harare North',assigned:2,required:2,status:'Covered'},{name:'Borrowdale Offices',area:'Borrowdale, Harare',assigned:1,required:1,status:'Covered'},{name:'Granite Logistics',area:'Southerton, Harare',assigned:1,required:2,status:'Coverage gap'},{name:'Eastgate Warehouse',area:'Msasa, Harare',assigned:0,required:1,status:'Coverage gap'}]};let data;try{data=JSON.parse(localStorage.getItem('baseguard-demo-v1'))||structuredClone(defaults)}catch{data=structuredClone(defaults)}function save(){localStorage.setItem('baseguard-demo-v1',JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function badge(s){let c=/high|gap/i.test(s)?'red':/review|follow|medium|scheduled/i.test(s)?'amber':/acknowledged|covered|duty/i.test(s)?'green':'gray';return `<span class="badge ${c}">${esc(s)}</span>`}function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}function go(p){page=p;query='';filter='All';document.getElementById('sidebar').classList.remove('open');render();window.scrollTo(0,0)}function toast(s){document.getElementById('toast').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>document.getElementById('toast').innerHTML='',3000)}function button(t,p){return `<button class="text-btn" onclick="go('${p}')">${t}</button>`}function head(title,desc,action=''){return `<div class="heading"><div><div class="eyebrow">SUPERVISOR WORKSPACE</div><h1>${title}</h1><p>${desc}</p></div><div class="header-actions">${action}</div></div>`}function notice(){return `<div class="notice"><span>ⓘ</span><span><b>Demonstration data.</b> Changes stay in this browser only; nothing is sent to a server or to guards.</span></div>`}function metric(title,value,sub,icon){return `<div class="metric"><div class="metric-top">${title}<span class="metric-icon">${icon}</span></div><div class="metric-value">${value}</div><small>${sub}</small></div>`}function cardHead(t,d,more=''){return `<div class="card-head"><div><h2>${t}</h2><p>${d}</p></div>${more}</div>`}function renderNav(){document.getElementById('nav').innerHTML=nav.map(([id,label,icon],i)=>`${i===5?'<div class="nav-label" style="margin-top:24px">MANAGEMENT</div>':''}<button class="nav-btn ${page===id?'active':''}" onclick="go('${id}')"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${lineIcons[id]}</svg></span>${label}${id==='incidents'?`<span class="nav-badge">${data.incidents.filter(x=>x.status==='Needs review').length}</span>`:''}</button>`).join('');document.getElementById('crumb').textContent=nav.find(n=>n[0]===page)[1]}
function overview(){const gaps=data.sites.filter(x=>x.assigned<x.required).length;let pending=data.incidents.filter(x=>x.status!=='Acknowledged').length;return head('Operations overview','A clear view of your security operations today.',`<button class="btn secondary" onclick="go('analytics')">▥ &nbsp; View analytics</button><button class="btn primary" onclick="openForm('incident')">＋ &nbsp; Log incident</button>`)+notice()+`<div class="metrics">${metric('Guards on duty',data.guards.filter(x=>x.status==='On duty').length,'Across the demo sites','♙')}${metric('Sites covered',`${data.sites.length-gaps} / ${data.sites.length}`,`${gaps} sites need attention`,'◇')}${metric('Open incidents',pending,'Review and follow up','⚑')}${metric('Pending handovers',data.handovers.filter(x=>x.status==='Needs review').length,'Awaiting demo review','⇄')}</div><div class="grid"><section class="card">${cardHead('Site coverage','Current demonstration shift',button('View all sites','sites'))}<div class="coverage">${data.sites.map(s=>`<div class="site-row"><span class="site-icon">▧</span><span class="site-name"><strong>${esc(s.name)}</strong><small>${esc(s.area)}</small></span><span class="site-count">${s.assigned} of ${s.required} guards</span>${badge(s.status)}</div>`).join('')}</div></section><section class="card">${cardHead('Needs attention','Items to review in this demo')}<div class="attention"><div class="att-row"><span class="att-icon red">!</span><div><strong>${gaps} sites have a coverage gap</strong><p>Review assigned guards and shift coverage.</p><small><button class="text-btn" onclick="go('sites')">Review coverage</button></small></div></div><div class="att-row"><span class="att-icon">⚑</span><div><strong>${pending} incidents need follow-up</strong><p>Review incident details and add a note.</p><small><button class="text-btn" onclick="go('incidents')">Open incidents</button></small></div></div><div class="att-row"><span class="att-icon green">⇄</span><div><strong>Shift handovers ready to review</strong><p>Keep the next shift informed of open items.</p><small><button class="text-btn" onclick="go('handovers')">View handovers</button></small></div></div></div></section></div><section class="card lower">${cardHead('Recent incidents','The latest activity across your sites',button('View all incidents','incidents'))}${incidentTable(data.incidents.slice(0,3))}</section>`}
function incidentTable(rows){return `<div class="table-wrap"><table class="table"><thead><tr><th>Incident</th><th>Site</th><th>Priority</th><th>Status</th><th>Reported</th></tr></thead><tbody>${rows.map(x=>`<tr class="clickable" onclick="detail('incidents','${esc(x.id)}')"><td><strong>${esc(x.title)}</strong><span class="sub">${esc(x.id)} · ${esc(x.guard)}</span></td><td>${esc(x.site)}</td><td>${badge(x.priority)}</td><td>${badge(x.status)}</td><td>${esc(x.time)}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No records match your filters.</div>'}</div>`}
function filtered(list){return list.filter(x=>JSON.stringify(x).toLowerCase().includes(query.toLowerCase())&&(filter==='All'||Object.values(x).includes(filter)))}function filterUI(options){return `<div class="filters"><input class="field" placeholder="Search records..." value="${esc(query)}" oninput="query=this.value;refreshList()" aria-label="Search records"><select aria-label="Filter records" onchange="filter=this.value;refreshList()"><option>All</option>${options.map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select></div>`}function listPage(kind){let info={incidents:['Incident management','Review incidents, record follow-up and track their status.','incident',['Needs review','In follow-up','Acknowledged']],occurrence:['Digital occurrence book','Review the operational record across sites.','occurrence',['Demo record','Locally saved']],handovers:['Shift handovers','Keep important information visible between shifts.','handover',['Needs review','Acknowledged','Locally saved']]}[kind];return head(info[0],info[1],`<button class="btn primary" onclick="openForm('${info[2]}')">＋ &nbsp; ${kind==='incidents'?'Log incident':kind==='occurrence'?'Add entry':'Add handover'}</button>`)+notice()+`<section class="card">${cardHead(info[0],`${data[kind].length} fictional records`)}${filterUI(info[3])}<div id="list">${listBody(kind)}</div></section>`}function listBody(kind){let rows=filtered(data[kind]);if(kind==='incidents')return incidentTable(rows);return `<div class="table-wrap"><table class="table"><thead><tr><th>Entry</th><th>Site</th><th>Guard</th><th>Status</th><th>Time</th></tr></thead><tbody>${rows.map(x=>`<tr class="clickable" onclick="detail('${kind}','${esc(x.id)}')"><td><strong>${esc(x.title)}</strong><span class="sub">${esc(x.id)}</span></td><td>${esc(x.site)}</td><td>${esc(x.guard)}</td><td>${badge(x.status)}</td><td>${esc(x.time)}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No records match your filters.</div>'}</div>`}function refreshList(){if(['incidents','occurrence','handovers'].includes(page))document.getElementById('list').innerHTML=listBody(page);else if(page==='guards')document.getElementById('list').innerHTML=guardsTable();else if(page==='sites')document.getElementById('list').innerHTML=sitesTable()}
function guardsTable(){let rows=filtered(data.guards);return `<div class="table-wrap"><table class="table"><thead><tr><th>Guard</th><th>Assigned site</th><th>Shift</th><th>Status</th></tr></thead><tbody>${rows.map(g=>`<tr><td><strong>${esc(g.name)}</strong><span class="sub">Fictional guard</span></td><td>${esc(g.site)}</td><td>${esc(g.shift)}</td><td>${badge(g.status)}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No guards match your filters.</div>'}</div>`}function guards(){return head('Guards & shift coverage','See who is on duty and who is scheduled next.')+notice()+`<div class="metrics">${metric('On duty',data.guards.filter(x=>x.status==='On duty').length,'Fictional guard records','♙')}${metric('Scheduled',data.guards.filter(x=>x.status==='Scheduled').length,'Upcoming demo shifts','◷')}${metric('Sites with gaps',data.sites.filter(x=>x.assigned<x.required).length,'Review assignments','!')}${metric('Total guards',data.guards.length,'In this demonstration','♧')}</div><section class="card">${cardHead('Guard roster','Demo shift assignments')}${filterUI(['On duty','Scheduled'])}<div id="list">${guardsTable()}</div></section>`}function sitesTable(){let rows=filtered(data.sites);return `<div class="table-wrap"><table class="table"><thead><tr><th>Site</th><th>Area</th><th>Guard coverage</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map((s)=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(s.area)}</td><td>${s.assigned} of ${s.required} guards</td><td>${badge(s.status)}</td><td><button class="text-btn" onclick="assign('${esc(s.name)}')">Edit demo coverage</button></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No sites match your filters.</div>'}</div>`}function sites(){return head('Sites & assignments','Understand coverage across your locations.')+notice()+`<section class="card">${cardHead('Site directory','Fictional sites and coverage')}${filterUI(['Covered','Coverage gap'])}<div id="list">${sitesTable()}</div></section>`}function analytics(){return head('Operational analytics','Explore a sample view of your operational activity.')+notice()+`<div class="tiles"><div class="card tile"><h3>Coverage rate</h3><div class="big">${Math.round(data.sites.filter(x=>x.assigned>=x.required).length/data.sites.length*100)}%</div><p>Sites with their full demo guard requirement covered.</p><div class="bar"><i style="width:${data.sites.filter(x=>x.assigned>=x.required).length/data.sites.length*100}%"></i></div></div><div class="card tile"><h3>Incidents for review</h3><div class="big">${data.incidents.filter(x=>x.status==='Needs review').length}</div><p>Records currently marked as needing review.</p></div><div class="card tile"><h3>Recorded handovers</h3><div class="big">${data.handovers.length}</div><p>Fictional handovers available in this workspace.</p></div></div><div class="grid lower"><section class="card">${cardHead('Incident activity','Illustrative sample · past seven days')}<div class="chart">${[35,60,40,78,50,92,65].map((n,i)=>`<div style="height:${n}%"><span>${['T','W','T','F','S','S','M'][i]}</span></div>`).join('')}</div><p class="status-note" style="padding:8px 20px 18px">Illustrative chart, not calculated from incident records.</p></section><section class="card">${cardHead('About these insights','For design review')}<div style="padding:0 21px 20px;color:#778a7f;line-height:1.7">The totals above are calculated from the current demonstration records. The weekly chart is illustrative and does not represent real activity.</div></section></div>`}function settings(){return head('Account & settings','Manage your demonstration workspace.')+notice()+`<section class="card">${cardHead('Profile','Fictional supervisor account')}<div class="settings-row"><div><strong>Tanaka Moyo</strong><p>Operations supervisor · Demo profile</p></div><span class="avatar">TM</span></div><div class="settings-row"><div><strong>Data storage</strong><p>Changes are stored locally in this browser. Clearing browser data removes them.</p></div>${badge('Local only')}</div><div class="settings-row"><div><strong>Reset demonstration</strong><p>Restore the original fictional records on this device.</p></div><button class="btn" onclick="resetDemo()">Reset data</button></div></section>`}function render(){renderNav();document.getElementById('content').innerHTML=page==='overview'?overview():['incidents','occurrence','handovers'].includes(page)?listPage(page):page==='guards'?guards():page==='sites'?sites():page==='analytics'?analytics():settings()}
function modal(html){document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}function closeModal(){document.getElementById('modal').innerHTML=''}function openForm(kind){let title=kind==='incident'?'Log an incident':kind==='occurrence'?'Add occurrence entry':'Add shift handover';modal(`<h2>${title}</h2><p>Fictional demonstration only. Your entry will be saved in this browser.</p><form onsubmit="submitForm(event,'${kind}')"><label for="title">Title</label><input id="title" name="title" required maxlength="100" placeholder="Brief description"><label for="site">Site</label><select name="site" id="site">${data.sites.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select>${kind==='incident'?'<label for="priority">Priority</label><select name="priority" id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select>':''}<label for="detail">Details</label><textarea id="detail" name="detail" required placeholder="Add useful context for this demonstration"></textarea><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save locally</button></div></form>`)}function submitForm(e,kind){e.preventDefault();let f=new FormData(e.target),k=kind==='incident'?'incidents':kind==='occurrence'?'occurrence':'handovers';data[k].unshift({id:'LOCAL-'+Date.now().toString().slice(-6),title:f.get('title'),site:f.get('site'),priority:f.get('priority')||'',detail:f.get('detail'),guard:'Demo supervisor',time:'Just now',status:'Locally saved'});save();closeModal();go(k);toast('Saved locally in this browser')}function detail(k,id){let x=data[k].find(r=>r.id===id);if(!x)return;modal(`<h2>${esc(x.title)}</h2><p>${esc(x.id)} · ${esc(x.site)} · ${esc(x.time)}</p><div style="margin:17px 0">${badge(x.status)} ${x.priority?badge(x.priority):''}</div><p>${esc(x.detail)}</p><p><strong>Recorded by:</strong> ${esc(x.guard)}</p>${x.note?`<p><strong>Local follow-up note:</strong> ${esc(x.note)}</p>`:''}<p class="status-note">${x.id.startsWith('LOCAL')?'This entry exists only in your browser.':'This is a fictional example, including its displayed status.'} Server receipt is not represented in this demo.</p>${k!=='occurrence'?`<label for="note">Follow-up note</label><textarea id="note" placeholder="Add a local review note">${esc(x.note||'')}</textarea>`:''}<div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button>${k!=='occurrence'?`<button class="btn" onclick="updateRecord('${k}','${esc(id)}','In follow-up')">Save follow-up locally</button><button class="btn primary" onclick="updateRecord('${k}','${esc(id)}','Acknowledged')">Acknowledge in demo</button>`:''}</div>`)}function updateRecord(k,id,status){let x=data[k].find(r=>r.id===id);x.note=document.getElementById('note').value;x.status=status;x.localReview=true;save();closeModal();render();toast('Demo review saved locally; no server receipt')}function assign(name){let s=data.sites.find(x=>x.name===name);modal(`<h2>Edit demo coverage</h2><p>${esc(name)} · Adjust the illustrative count stored in this browser.</p><form onsubmit="saveAssign(event,'${esc(name)}')"><label for="assigned">Guards on duty</label><input id="assigned" name="assigned" type="number" min="0" max="99" value="${s.assigned}" required><label for="required">Guards required</label><input id="required" name="required" type="number" min="1" max="99" value="${s.required}" required><p class="status-note">This changes only the demo coverage count; it does not assign a real guard or change the roster.</p><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save locally</button></div></form>`)}function saveAssign(e,name){e.preventDefault();let f=new FormData(e.target),s=data.sites.find(x=>x.name===name);s.assigned=Number(f.get('assigned'));s.required=Number(f.get('required'));s.status=s.assigned>=s.required?'Covered':'Coverage gap';save();closeModal();render();toast('Demo coverage saved locally')}function resetDemo(){modal(`<h2>Reset demo data?</h2><p>This removes changes made in this browser and restores the original fictional records.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmReset()">Reset demo</button></div>`)}function confirmReset(){data=structuredClone(defaults);save();closeModal();render();toast('Demonstration data restored')}render();
</script></body></html>
